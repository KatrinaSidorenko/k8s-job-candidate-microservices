apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service-deployment
  labels:
    app: job-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
    spec:
      containers:
      - name: job-service
        image: vinsdocker/k8s-dice-job
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: job-service-db-secret
              key: MONGO_USER
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: job-service-db-secret
              key: MONGO_PASSWORD

        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: job-service-db-config
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: job-service-db-config
              key: MONGO_PORT
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: job-service-db-config
              key: MONGO_DB

        - name: spring.data.mongodb.uri
          value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DB)"
